name: CI

"on":
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        env:
          # The root preinstall guard checks this variable. GitHub's shell
          # environment may not populate it even when pnpm is the executable.
          npm_config_user_agent: pnpm/11.1.3
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        env:
          PORT: 3000
          BASE_PATH: /
        run: pnpm run build

      - name: Validate skills
        run: pnpm run skill:validate
