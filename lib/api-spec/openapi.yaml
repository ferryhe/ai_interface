openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: modules
    description: Module catalog and ingest operations
  - name: agent-config
    description: Agent control plane configuration
  - name: agent-runs
    description: Agent runtime planning and module orchestration
  - name: tool-adapters
    description: External tool adapter metadata and readiness
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /modules:
    get:
      operationId: listModules
      tags: [modules]
      summary: List registered modules
      description: Returns the module catalog available to Agent.
      responses:
        "200":
          description: Registered module catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleListResponse"
  /tool-adapters:
    get:
      operationId: getToolAdapters
      tags: [tool-adapters]
      summary: List tool adapters
      description: Returns external tool adapter metadata and redacted readiness by environment variable name.
      responses:
        "200":
          description: Tool adapter metadata and readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolAdapterListResponse"
  /module-runs:
    post:
      operationId: createModuleRun
      tags: [modules]
      summary: Create or update a module run
      description: Idempotently creates or updates a module run by moduleId and externalRunId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateModuleRunRequest"
      responses:
        "200":
          description: Existing module run updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleRunIngestResponse"
        "201":
          description: New module run created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleRunIngestResponse"
        "400":
          description: Invalid ingest payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /module-runs/{runId}:
    get:
      operationId: getModuleRun
      tags: [modules]
      summary: Get a module run
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Module run detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleRunDetail"
        "404":
          description: Module run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateModuleRun
      tags: [modules]
      summary: Update a module run
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateModuleRunRequest"
      responses:
        "200":
          description: Updated module run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleRun"
        "404":
          description: Module run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /module-runs/{runId}/events:
    post:
      operationId: createModuleRunEvent
      tags: [modules]
      summary: Append a module run event
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunEventRequest"
      responses:
        "201":
          description: Event recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunEvent"
        "404":
          description: Module run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /module-runs/{runId}/artifacts:
    post:
      operationId: createModuleRunArtifact
      tags: [modules]
      summary: Store a module artifact
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateArtifactRequest"
      responses:
        "201":
          description: Artifact stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        "404":
          description: Module run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /module-runs/{runId}/interactions:
    post:
      operationId: createModuleRunInteraction
      tags: [modules]
      summary: Request user feedback for a module run
      description: Stores an interaction request from an external tool and marks the run metadata as waiting for user feedback, approval, data, or unblock input.
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateToolInteractionRequest"
      responses:
        "201":
          description: Interaction request recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolInteractionResponse"
        "404":
          description: Module run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /module-runs/{runId}/feedback:
    post:
      operationId: submitModuleRunFeedback
      tags: [modules]
      summary: Submit user feedback for a module run
      description: Records user or Agent feedback for the active interaction and marks the module run as resumable.
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitToolFeedbackRequest"
      responses:
        "200":
          description: Feedback recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolInteractionResponse"
        "404":
          description: Module run or active interaction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /module-runs/{runId}/resume:
    post:
      operationId: resumeModuleRunExecution
      tags: [modules]
      summary: Resume execution for a module run
      description: Consumes a resumable tool interaction, records a resume request, and resumes through the safe fake adapter executor.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Resume accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolInteractionResponse"
        "404":
          description: Module run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: No resumable interaction or adapter resume unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /artifacts/{artifactId}:
    get:
      operationId: getArtifact
      tags: [modules]
      summary: Get an artifact
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
      responses:
        "200":
          description: Artifact detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        "404":
          description: Artifact not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /agent-runs:
    post:
      operationId: createAgentRun
      tags: [agent-runs]
      summary: Create an Agent runtime plan
      description: Stores the user message, creates a pipeline run, and plans module runs using enabled business skills.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentRunRequest"
      responses:
        "200":
          description: Agent run planned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunResponse"
        "201":
          description: Agent run planned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunResponse"
        "400":
          description: Invalid Agent run request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /agent-runs/{pipelineRunId}:
    get:
      operationId: getAgentRun
      tags: [agent-runs]
      summary: Get an Agent runtime run
      parameters:
        - $ref: "#/components/parameters/PipelineRunId"
      responses:
        "200":
          description: Agent run detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunDetail"
        "404":
          description: Agent run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /agent-config:
    get:
      operationId: getAgentConfig
      tags: [agent-config]
      summary: Get Agent configuration
      description: Returns the persisted Agent control plane configuration and OpenAI API key status.
      responses:
        "200":
          description: Agent configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentConfigResponse"
    put:
      operationId: updateAgentConfig
      tags: [agent-config]
      summary: Update Agent configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgentConfigRequest"
      responses:
        "200":
          description: Updated Agent configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentConfigResponse"
        "400":
          description: Invalid configuration payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /agent-config/test-connection:
    post:
      operationId: testAgentConfigConnection
      tags: [agent-config]
      summary: Test Agent provider connection
      description: Reports whether OPENAI_API_KEY is configured without accepting or returning secrets.
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentConnectionTestResponse"
components:
  parameters:
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PipelineRunId:
      name: pipelineRunId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    JsonObject:
      type: object
      additionalProperties: true
    ModuleId:
      type: string
      enum:
        - web_listening
        - doc_to_md
        - md_to_rag
        - rag_to_agent
    ModuleCategory:
      type: string
      enum:
        - source
        - transform
        - index
        - agent
    ModuleRunStatus:
      type: string
      enum:
        - pending
        - running
        - succeeded
        - failed
        - cancelled
    ToolAdapterKind:
      type: string
      enum:
        - http
        - cli
    ToolAdapterReadinessStatus:
      type: string
      enum:
        - ready
        - missing_required_env
    ToolAdapterDefinition:
      type: object
      properties:
        adapterId:
          type: string
        moduleId:
          $ref: "#/components/schemas/ModuleId"
        adapterKind:
          $ref: "#/components/schemas/ToolAdapterKind"
        displayName:
          type: string
        description:
          type: string
        sourceRepo:
          type: string
        requiredEnv:
          type: array
          items:
            type: string
        optionalEnv:
          type: array
          items:
            type: string
        timeoutMs:
          type: integer
        maxOutputBytes:
          type: integer
        allowedCommands:
          type: array
          items:
            type: string
        supportsResume:
          type: boolean
        readinessHint:
          type: string
      required:
        - adapterId
        - moduleId
        - adapterKind
        - displayName
        - description
        - sourceRepo
        - requiredEnv
        - optionalEnv
        - timeoutMs
        - maxOutputBytes
        - allowedCommands
        - supportsResume
        - readinessHint
    ToolAdapterReadiness:
      type: object
      properties:
        adapterId:
          type: string
        moduleId:
          $ref: "#/components/schemas/ModuleId"
        adapterKind:
          $ref: "#/components/schemas/ToolAdapterKind"
        displayName:
          type: string
        description:
          type: string
        sourceRepo:
          type: string
        requiredEnv:
          type: array
          items:
            type: string
        optionalEnv:
          type: array
          items:
            type: string
        timeoutMs:
          type: integer
        maxOutputBytes:
          type: integer
        allowedCommands:
          type: array
          items:
            type: string
        supportsResume:
          type: boolean
        readinessHint:
          type: string
        configured:
          type: boolean
        status:
          $ref: "#/components/schemas/ToolAdapterReadinessStatus"
        missingRequiredEnv:
          type: array
          items:
            type: string
        configuredOptionalEnv:
          type: array
          items:
            type: string
      required:
        - adapterId
        - moduleId
        - adapterKind
        - displayName
        - description
        - sourceRepo
        - requiredEnv
        - optionalEnv
        - timeoutMs
        - maxOutputBytes
        - allowedCommands
        - supportsResume
        - readinessHint
        - configured
        - status
        - missingRequiredEnv
        - configuredOptionalEnv
    ToolAdapterListResponse:
      type: object
      properties:
        adapters:
          type: array
          items:
            $ref: "#/components/schemas/ToolAdapterDefinition"
        readiness:
          type: array
          items:
            $ref: "#/components/schemas/ToolAdapterReadiness"
      required:
        - adapters
        - readiness
    RunEventSeverity:
      type: string
      enum:
        - info
        - warning
        - error
    ToolInteractionKind:
      type: string
      enum:
        - question
        - approval
        - data_request
        - blocked
    ToolInteractionStatus:
      type: string
      enum:
        - waiting_for_user
        - waiting_for_approval
        - waiting_for_data
        - blocked
        - resumable
        - resumed
    ToolInteractionOption:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        description:
          type: string
        value:
          $ref: "#/components/schemas/JsonObject"
      required:
        - id
        - label
    ToolInteractionFeedback:
      type: object
      properties:
        responseText:
          type: string
        selectedOptionId:
          type: string
        approved:
          type: boolean
        artifactIds:
          type: array
          items:
            type: string
        resumeHandle:
          type: string
        metadata:
          $ref: "#/components/schemas/JsonObject"
      required:
        - artifactIds
        - metadata
    ToolInteraction:
      type: object
      properties:
        interactionId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ToolInteractionStatus"
        kind:
          $ref: "#/components/schemas/ToolInteractionKind"
        title:
          type: string
        message:
          type: string
        prompt:
          type:
            - string
            - "null"
        options:
          type: array
          items:
            $ref: "#/components/schemas/ToolInteractionOption"
        artifactIds:
          type: array
          items:
            type: string
        resumeHandle:
          type:
            - string
            - "null"
        requestedBy:
          type:
            - string
            - "null"
        requestedAt:
          type: string
          format: date-time
        metadata:
          $ref: "#/components/schemas/JsonObject"
        respondedAt:
          type: string
          format: date-time
        response:
          $ref: "#/components/schemas/ToolInteractionFeedback"
      required:
        - interactionId
        - status
        - kind
        - title
        - message
        - prompt
        - options
        - artifactIds
        - resumeHandle
        - requestedBy
        - requestedAt
        - metadata
    CreateToolInteractionRequest:
      type: object
      properties:
        kind:
          $ref: "#/components/schemas/ToolInteractionKind"
        title:
          type: string
        message:
          type: string
        prompt:
          type: string
        options:
          type: array
          items:
            $ref: "#/components/schemas/ToolInteractionOption"
        artifactIds:
          type: array
          items:
            type: string
        resumeHandle:
          type: string
        requestedBy:
          type: string
        metadata:
          $ref: "#/components/schemas/JsonObject"
      required:
        - kind
        - title
        - message
    SubmitToolFeedbackRequest:
      type: object
      properties:
        responseText:
          type: string
        selectedOptionId:
          type: string
        approved:
          type: boolean
        artifactIds:
          type: array
          items:
            type: string
        resumeHandle:
          type: string
        metadata:
          $ref: "#/components/schemas/JsonObject"
    ToolInteractionResponse:
      type: object
      properties:
        run:
          $ref: "#/components/schemas/ModuleRun"
        event:
          $ref: "#/components/schemas/RunEvent"
        interaction:
          $ref: "#/components/schemas/ToolInteraction"
      required:
        - run
        - event
        - interaction
    AgentProvider:
      type: string
      enum:
        - openai
    AgentEndpoint:
      type: string
      enum:
        - responses
        - agents_sdk
    AgentReasoningEffort:
      type: string
      enum:
        - none
        - low
        - medium
        - high
        - xhigh
    AgentConnectionStatus:
      type: string
      enum:
        - configured
        - missing_key
    MemoryPromotionMode:
      type: string
      enum:
        - manual
        - agent_suggested
    GeneralSkillId:
      type: string
      enum:
        - web_search
        - browser
        - github
        - notion
        - lark
        - file_tools
    BusinessSkillSetting:
      type: object
      properties:
        moduleId:
          $ref: "#/components/schemas/ModuleId"
        enabled:
          type: boolean
        approvalRequired:
          type: boolean
        canUseNetwork:
          type: boolean
        canWriteDatabase:
          type: boolean
      required:
        - moduleId
        - enabled
        - approvalRequired
        - canUseNetwork
        - canWriteDatabase
    GeneralSkillSetting:
      type: object
      properties:
        skillId:
          $ref: "#/components/schemas/GeneralSkillId"
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        installed:
          type: boolean
        installOnDemand:
          type: boolean
        requiresApproval:
          type: boolean
        canUseNetwork:
          type: boolean
      required:
        - skillId
        - name
        - description
        - enabled
        - installed
        - installOnDemand
        - requiresApproval
        - canUseNetwork
    AgentMemorySettings:
      type: object
      properties:
        shortTermEnabled:
          type: boolean
        longTermEnabled:
          type: boolean
        promotionMode:
          $ref: "#/components/schemas/MemoryPromotionMode"
        ragCollection:
          type: string
        retentionDays:
          type: integer
          minimum: 1
      required:
        - shortTermEnabled
        - longTermEnabled
        - promotionMode
        - ragCollection
        - retentionDays
    AgentSafetySettings:
      type: object
      properties:
        requireApprovalForExternalActions:
          type: boolean
        requireApprovalForPublishing:
          type: boolean
        allowSelfLearning:
          type: boolean
        maxToolSteps:
          type: integer
          minimum: 1
      required:
        - requireApprovalForExternalActions
        - requireApprovalForPublishing
        - allowSelfLearning
        - maxToolSteps
    AgentPublishStatus:
      type: string
      enum: [draft, published, paused]
    PortalAccessMode:
      type: string
      enum: [token]
    AgentPublishSettings:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/AgentPublishStatus"
        portalAccessMode:
          $ref: "#/components/schemas/PortalAccessMode"
        portalTokenLast4:
          type:
            - string
            - "null"
        portalTokenUpdatedAt:
          type:
            - string
            - "null"
          format: date-time
        publishedAt:
          type:
            - string
            - "null"
          format: date-time
        versionLabel:
          type: string
      required:
        - status
        - portalAccessMode
        - portalTokenLast4
        - portalTokenUpdatedAt
        - publishedAt
        - versionLabel
    UpdateAgentPublishSettings:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/AgentPublishStatus"
        portalAccessMode:
          $ref: "#/components/schemas/PortalAccessMode"
        setPortalToken:
          type: string
        versionLabel:
          type: string
    AgentConfig:
      type: object
      properties:
        id:
          type: string
          format: uuid
        configKey:
          type: string
        provider:
          $ref: "#/components/schemas/AgentProvider"
        endpoint:
          $ref: "#/components/schemas/AgentEndpoint"
        modelId:
          type: string
        reasoningEffort:
          $ref: "#/components/schemas/AgentReasoningEffort"
        systemPrompt:
          type: string
        businessSkillSettings:
          type: array
          items:
            $ref: "#/components/schemas/BusinessSkillSetting"
        generalSkillSettings:
          type: array
          items:
            $ref: "#/components/schemas/GeneralSkillSetting"
        memorySettings:
          $ref: "#/components/schemas/AgentMemorySettings"
        safetySettings:
          $ref: "#/components/schemas/AgentSafetySettings"
        publishSettings:
          $ref: "#/components/schemas/AgentPublishSettings"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - configKey
        - provider
        - endpoint
        - modelId
        - reasoningEffort
        - systemPrompt
        - businessSkillSettings
        - generalSkillSettings
        - memorySettings
        - safetySettings
        - publishSettings
        - createdAt
        - updatedAt
    AgentConnectionStatusPayload:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/AgentConnectionStatus"
      required:
        - status
    AgentConfigResponse:
      type: object
      properties:
        config:
          $ref: "#/components/schemas/AgentConfig"
        connection:
          $ref: "#/components/schemas/AgentConnectionStatusPayload"
      required:
        - config
        - connection
    UpdateAgentConfigRequest:
      type: object
      properties:
        provider:
          $ref: "#/components/schemas/AgentProvider"
        endpoint:
          $ref: "#/components/schemas/AgentEndpoint"
        modelId:
          type: string
        reasoningEffort:
          $ref: "#/components/schemas/AgentReasoningEffort"
        systemPrompt:
          type: string
        businessSkillSettings:
          type: array
          items:
            $ref: "#/components/schemas/BusinessSkillSetting"
        generalSkillSettings:
          type: array
          items:
            $ref: "#/components/schemas/GeneralSkillSetting"
        memorySettings:
          $ref: "#/components/schemas/AgentMemorySettings"
        safetySettings:
          $ref: "#/components/schemas/AgentSafetySettings"
        publishSettings:
          $ref: "#/components/schemas/UpdateAgentPublishSettings"
    AgentConnectionTestResponse:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/AgentConnectionStatus"
        checkedAt:
          type: string
          format: date-time
      required:
        - status
        - checkedAt
    AgentRuntimeStatus:
      type: string
      enum:
        - planned
        - missing_key
        - needs_approval
        - failed
    AgentRunExecutionMode:
      type: string
      enum:
        - plan_only
        - execute_ready
    AgentMessageRole:
      type: string
      enum:
        - user
        - agent
        - system
        - tool
    AgentRuntimeConnection:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/AgentConnectionStatus"
      required:
        - status
    AgentThread:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          enum:
            - active
            - archived
        metadata:
          oneOf:
            - $ref: "#/components/schemas/JsonObject"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - status
        - metadata
        - createdAt
        - updatedAt
    AgentMessage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        threadId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/AgentMessageRole"
        content:
          type: string
        metadata:
          oneOf:
