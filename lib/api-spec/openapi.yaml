openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: modules
    description: Module catalog and ingest operations
  - name: agent-config
    description: Agent control plane configuration
  - name: portal-auth
    description: Portal token verification
  - name: agent-runs
    description: Agent runtime planning and module orchestration
  - name: missions
    description: Mission intake, revision, approval, and execution readiness
  - name: run-inspector
    description: Read-only run, timeline, event, and artifact inspection
  - name: tool-adapters
    description: External tool adapter metadata and readiness
  - name: skills
    description: Generic skill manifests, UI capabilities, and readiness
  - name: agents
    description: Agent manifests, skill bindings, and readiness
  - name: pipelines
    description: Guarded local pipeline run operations and status visibility
  - name: climate-monitor
    description: Climate monitor repository status and guarded run operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /modules:
    get:
      operationId: listModules
      tags: [modules]
      summary: List registered modules
      description: Returns the module catalog available to Agent.
      responses:
        "200":
          description: Registered module catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleListResponse"
  /tool-adapters:
    get:
      operationId: getToolAdapters
      tags: [tool-adapters]
      summary: List tool adapters
      description: Returns external tool adapter metadata and redacted readiness by environment variable name.
      responses:
        "200":
          description: Tool adapter metadata and readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolAdapterListResponse"
  /skills:
    get:
      operationId: getSkills
      tags: [skills]
      summary: List skill manifests
      description: >-
        Returns generic skill manifest metadata, redacted adapter readiness, and
        project path readiness without exposing configured path or secret values.
      responses:
        "200":
          description: Skill manifests and readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillListResponse"
  /agents:
    get:
      operationId: getAgents
      tags: [agents]
      summary: List agent manifests
      description: >-
        Returns agent manifest metadata and skill-reference readiness without
        exposing secrets or configured absolute local paths.
      responses:
        "200":
          description: Agent manifests and readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentListResponse"
  /agents/{agentId}/export/vscode-agent:
    get:
      operationId: exportVscodeAgent
      tags: [agents]
      summary: Export a VS Code agent file
      description: >-
        Returns a VS Code-compatible `.agent.md` file with YAML front matter
        containing the agent description and registered bound skill IDs as
        tools. Secret-looking values, local provider URLs, MCP server URLs, and
        local paths are redacted from exported text.
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AgentId"
      responses:
        "200":
          description: VS Code agent Markdown
          content:
            text/markdown:
              schema:
                type: string
        "404":
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /agents/{agentId}/export/mcp-tool:
    get:
      operationId: exportAgentMcpTool
      tags: [agents]
      summary: Export MCP wrapper tool metadata
      description: >-
        Returns redacted metadata for exposing an agent run entrypoint as an
        MCP-callable tool. Provider internals and local configuration values are
        omitted.
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AgentId"
      responses:
        "200":
          description: MCP wrapper tool metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentMcpToolMetadata"
        "404":
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /climate-monitor/status:
    get:
      operationId: getClimateMonitorStatus
      tags: [climate-monitor]
      summary: Get climate monitor status
      description: >-
        Returns redacted climate monitor repository status, latest report
        summary, source/scope coverage, and git branch/dirty state without
        exposing configured absolute paths or secret values.
      responses:
        "200":
          description: Climate monitor status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClimateMonitorStatusResponse"
        "500":
          description: Failed to read climate monitor status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /climate-monitor/runs:
    post:
      operationId: createClimateMonitorRun
      tags: [climate-monitor]
      summary: Run the climate monitor
      description: >-
        Runs the fixed `python scripts/run_climate_monitor.py --json` command.
        Dry runs are the default, write outputs under the ai_interface workspace
        `.tmp` directory, and add no-sync/no-state-update guards. Live runs are
        rejected unless `CLIMATE_MONITOR_ALLOW_LIVE_RUNS=1` is set on the server.
        The request must include an explicit local command intent header and
        pass same-origin checks. Responses include parsed JSON plus safe command
        metadata.
      parameters:
        - in: header
          name: X-AI-Interface-Command-Intent
          required: true
          schema:
            type: string
            enum: [climate-monitor-run]
          description: Required command intent guard for local climate monitor runs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClimateMonitorRunRequest"
      responses:
        "200":
          description: Climate monitor run result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClimateMonitorRunResponse"
        "400":
          description: Invalid request or climate monitor not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Command guard rejected the request or live runs are disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to run climate monitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /module-runs:
    post:
      operationId: createModuleRun
      tags: [modules]
      summary: Create or update a module run
      description: Idempotently creates or updates a module run by moduleId and externalRunId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateModuleRunRequest"
      responses:
        "200":
          description: Existing module run updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleRunIngestResponse"
        "201":
          description: New module run created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleRunIngestResponse"
        "400":
          description: Invalid ingest payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /module-runs/{runId}:
    get:
      operationId: getModuleRun
      tags: [modules]
      summary: Get a module run
      description: >-
        Returns module run detail. Portal-origin reads send
        `X-AI-Interface-Surface: agent-portal` and require a verified Portal
        token through `X-Portal-Token` or `Authorization: Bearer <token>`.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/PortalSurface"
        - $ref: "#/components/parameters/PortalToken"
        - $ref: "#/components/parameters/AuthorizationHeader"
      responses:
        "200":
          description: Module run detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleRunDetail"
        "403":
          description: Portal access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Module run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateModuleRun
      tags: [modules]
      summary: Update a module run
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateModuleRunRequest"
      responses:
        "200":
          description: Updated module run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleRun"
        "404":
          description: Module run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /module-runs/{runId}/events:
    post:
      operationId: createModuleRunEvent
      tags: [modules]
      summary: Append a module run event
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunEventRequest"
      responses:
        "201":
          description: Event recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunEvent"
        "404":
          description: Module run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /module-runs/{runId}/artifacts:
    post:
      operationId: createModuleRunArtifact
      tags: [modules]
      summary: Store a module artifact
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateArtifactRequest"
      responses:
        "201":
          description: Artifact stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        "404":
          description: Module run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /module-runs/{runId}/interactions:
    post:
      operationId: createModuleRunInteraction
      tags: [modules]
      summary: Request user feedback for a module run
      description: Stores an interaction request from an external tool and marks the run metadata as waiting for user feedback, approval, data, or unblock input.
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateToolInteractionRequest"
      responses:
        "201":
          description: Interaction request recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolInteractionResponse"
        "404":
          description: Module run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /module-runs/{runId}/feedback:
    post:
      operationId: submitModuleRunFeedback
      tags: [modules]
      summary: Submit user feedback for a module run
      description: >-
        Records user or Agent feedback for the active interaction and marks the
        module run as resumable. Portal-origin requests send
        `X-AI-Interface-Surface: agent-portal` and require a verified Portal
        token through `X-Portal-Token` or `Authorization: Bearer <token>`.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/PortalSurface"
        - $ref: "#/components/parameters/PortalToken"
        - $ref: "#/components/parameters/AuthorizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitToolFeedbackRequest"
      responses:
        "200":
          description: Feedback recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolInteractionResponse"
        "403":
          description: Portal access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Module run or active interaction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /module-runs/{runId}/resume:
    post:
      operationId: resumeModuleRunExecution
      tags: [modules]
      summary: Resume execution for a module run
      description: >-
        Consumes a resumable tool interaction, records a resume request, and
        resumes through the safe fake adapter executor. Portal-origin requests
        send `X-AI-Interface-Surface: agent-portal` and require a verified
        Portal token through `X-Portal-Token` or `Authorization: Bearer
        <token>`.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/PortalSurface"
        - $ref: "#/components/parameters/PortalToken"
        - $ref: "#/components/parameters/AuthorizationHeader"
      responses:
        "200":
          description: Resume accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolInteractionResponse"
        "404":
          description: Module run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Portal access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: No resumable interaction or adapter resume unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /artifacts/{artifactId}:
    get:
      operationId: getArtifact
      tags: [modules]
      summary: Get an artifact
      description: >-
        Returns artifact detail. Portal-origin reads send
        `X-AI-Interface-Surface: agent-portal` and require a verified Portal
        token through `X-Portal-Token` or `Authorization: Bearer <token>`.
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
        - $ref: "#/components/parameters/PortalSurface"
        - $ref: "#/components/parameters/PortalToken"
        - $ref: "#/components/parameters/AuthorizationHeader"
      responses:
        "200":
          description: Artifact detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        "403":
          description: Portal access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Artifact not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /runs:
    get:
      operationId: listRuns
      tags: [run-inspector]
      summary: List agent pipeline runs
      description: >-
        Lists inspectable Agent pipeline runs with optional filters for agent,
        skill, module, status, and limit. Responses are redacted so configured
        secrets, provider URLs, MCP server URLs, adapter env values, and local
        absolute paths are not exposed.
      parameters:
        - in: query
          name: agentId
          schema:
            $ref: "#/components/schemas/AgentId"
        - in: query
          name: skillId
          schema:
            $ref: "#/components/schemas/SkillId"
        - in: query
          name: moduleId
          schema:
            $ref: "#/components/schemas/ModuleId"
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/ModuleRunStatus"
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Filtered run list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunListResponse"
        "400":
          description: Invalid run filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Run inspector reads are allowed only from localhost or same-origin admin clients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /runs/{pipelineRunId}/timeline:
    get:
      operationId: getRunTimeline
      tags: [run-inspector]
      summary: Get an agent run timeline
      description: >-
        Returns ordered thread messages, pipeline state, module runs, and run
        events for an Agent pipeline run with inspector redaction applied.
      parameters:
        - $ref: "#/components/parameters/PipelineRunId"
      responses:
        "200":
          description: Agent run timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunTimeline"
        "404":
          description: Agent run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Run inspector reads are allowed only from localhost or same-origin admin clients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /artifacts:
    get:
      operationId: listArtifacts
      tags: [run-inspector]
      summary: List artifacts
      description: >-
        Lists artifacts by pipeline run, module run, artifact kind, and limit
        with inspector redaction applied to content and provenance.
      parameters:
        - in: query
          name: pipelineRunId
          schema:
            type: string
            format: uuid
        - in: query
          name: moduleRunId
          schema:
            type: string
            format: uuid
        - in: query
          name: kind
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Filtered artifact list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactListResponse"
        "400":
          description: Invalid artifact filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Run inspector reads are allowed only from localhost or same-origin admin clients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /missions:
    post:
      operationId: createMission
      tags: [missions]
      summary: Create a draft mission
      description: >-
        Creates a mission intake record and initial draft plan for review.
        Portal-origin requests send `X-AI-Interface-Surface: agent-portal`
        and require a verified Portal token through `X-Portal-Token` or
        `Authorization: Bearer <token>`.
      parameters:
        - $ref: "#/components/parameters/PortalSurface"
        - $ref: "#/components/parameters/PortalToken"
        - $ref: "#/components/parameters/AuthorizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMissionRequest"
      responses:
        "201":
          description: Mission created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateMissionResult"
        "400":
          description: Invalid mission request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Portal access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /missions/{missionId}:
    get:
      operationId: getMission
      tags: [missions]
      summary: Get a mission and latest revision
      description: >-
        Returns the mission record, latest revision, and mission plan.
        Portal-origin reads send `X-AI-Interface-Surface: agent-portal`
        and require a verified Portal token through `X-Portal-Token` or
        `Authorization: Bearer <token>`.
      parameters:
        - $ref: "#/components/parameters/MissionId"
        - $ref: "#/components/parameters/PortalSurface"
        - $ref: "#/components/parameters/PortalToken"
        - $ref: "#/components/parameters/AuthorizationHeader"
      responses:
        "200":
          description: Mission detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetMissionResult"
        "403":
          description: Portal access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Mission not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /missions/{missionId}/revise:
    post:
      operationId: reviseMission
      tags: [missions]
      summary: Revise the latest mission draft
      parameters:
        - $ref: "#/components/parameters/MissionId"
        - $ref: "#/components/parameters/PortalSurface"
        - $ref: "#/components/parameters/PortalToken"
        - $ref: "#/components/parameters/AuthorizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviseMissionRequest"
      responses:
        "200":
          description: Mission revised
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviseMissionResult"
        "400":
          description: Invalid revise request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Portal access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Mission not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Stale mission revision conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /missions/{missionId}/approve:
    post:
      operationId: approveMission
      tags: [missions]
      summary: Approve the latest mission revision
      parameters:
        - $ref: "#/components/parameters/MissionId"
        - $ref: "#/components/parameters/PortalSurface"
        - $ref: "#/components/parameters/PortalToken"
        - $ref: "#/components/parameters/AuthorizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveMissionRequest"
      responses:
        "200":
          description: Mission approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApproveMissionResult"
        "400":
          description: Invalid approval request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Portal access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Mission or revision not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Stale mission revision conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /missions/{missionId}/execute:
    post:
      operationId: executeMission
      tags: [missions]
      summary: Mark a mission as executing
      description: >-
        Marks an approved mission as executing and returns stubbed execution
        readiness metadata until runtime orchestration is connected.
      parameters:
        - $ref: "#/components/parameters/MissionId"
        - $ref: "#/components/parameters/PortalSurface"
        - $ref: "#/components/parameters/PortalToken"
        - $ref: "#/components/parameters/AuthorizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteMissionRequest"
      responses:
        "200":
          description: Mission execution marked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecuteMissionResult"
        "400":
          description: Invalid execution request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Portal access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Mission or revision not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Mission must be approved before execution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /agent-runs:
    post:
      operationId: createAgentRun
      tags: [agent-runs]
      summary: Create an Agent runtime plan
      description: >-
        Stores the user message, creates a pipeline run, and plans module runs
        using enabled business skills. Portal-origin requests send
        `X-AI-Interface-Surface: agent-portal` or `metadata.source:
        agent-portal` and require a verified Portal token through
        `X-Portal-Token` or `Authorization: Bearer <token>`.
      parameters:
        - $ref: "#/components/parameters/PortalSurface"
        - $ref: "#/components/parameters/PortalToken"
        - $ref: "#/components/parameters/AuthorizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentRunRequest"
      responses:
        "200":
          description: Agent run planned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunResponse"
        "201":
          description: Agent run planned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunResponse"
        "400":
          description: Invalid Agent run request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Portal access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /agent-runs/{pipelineRunId}:
    get:
      operationId: getAgentRun
      tags: [agent-runs]
      summary: Get an Agent runtime run
      description: >-
        Returns Agent run detail. Portal-origin reads send
        `X-AI-Interface-Surface: agent-portal` and require a verified Portal
        token through `X-Portal-Token` or `Authorization: Bearer <token>`.
      parameters:
        - $ref: "#/components/parameters/PipelineRunId"
        - $ref: "#/components/parameters/PortalSurface"
        - $ref: "#/components/parameters/PortalToken"
        - $ref: "#/components/parameters/AuthorizationHeader"
      responses:
        "200":
          description: Agent run detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunDetail"
        "403":
          description: Portal access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Agent run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /pipelines/runs:
    post:
      operationId: startPipelineRun
      tags: [pipelines]
      summary: Start an actuarial pipeline run
      description: >-
        Starts the built-in ai_actuary actuarial reserving review pipeline over
        registered file-artifact CLI tools. The response exposes Backstage-safe
        step status, inputs, logs, artifacts, and errors without reimplementing
        actuarial calculations in TypeScript. This endpoint triggers local CLI
        execution and therefore requires the command-intent header plus the
        server-side localhost/same-origin request guard.
      parameters:
        - in: header
          name: X-AI-Interface-Command-Intent
          required: true
          schema:
            type: string
            enum: [actuarial-pipeline-run]
          description: Explicit opt-in header required to start a local actuarial pipeline run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartPipelineRunRequest"
      responses:
        "201":
          description: Pipeline run accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActuarialPipelineRun"
        "400":
          description: Invalid pipeline run request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Command intent, localhost, or same-origin guard rejected the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listActuarialPipelineRuns
      tags: [pipelines]
      summary: List actuarial pipeline runs
      description: Requires a localhost/same-origin request because run records can include local artifact paths and artifact payload previews.
      responses:
        "200":
          description: Pipeline run list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActuarialPipelineRunsList"
        "403":
          description: Localhost or same-origin guard rejected the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /pipelines/runs/{runId}:
    get:
      operationId: getPipelineRun
      tags: [pipelines]
      summary: Get an actuarial pipeline run
      description: Requires a localhost/same-origin request because run details can include local artifact paths and artifact payload previews.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Pipeline run detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActuarialPipelineRun"
        "400":
          description: Invalid run id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Localhost or same-origin guard rejected the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pipeline run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /agent-config:
    get:
      operationId: getAgentConfig
      tags: [agent-config]
      summary: Get Agent configuration
      description: Returns the persisted Agent control plane configuration and provider readiness based on required environment variables. Secret values and local provider URLs are never returned.
      responses:
        "200":
          description: Agent configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentConfigResponse"
    put:
      operationId: updateAgentConfig
      tags: [agent-config]
      summary: Update Agent configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgentConfigRequest"
      responses:
        "200":
          description: Updated Agent configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentConfigResponse"
        "400":
          description: Invalid configuration payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /agent-config/test-connection:
    post:
      operationId: testAgentConfigConnection
      tags: [agent-config]
      summary: Test Agent provider connection
      description: Reports provider readiness from server-side environment configuration without accepting or returning secrets or local provider URLs.
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentConnectionTestResponse"
  /portal-auth/verify:
    post:
      operationId: verifyPortalAccess
      tags: [portal-auth]
      summary: Verify Portal access token
      description: Checks a submitted Portal token against stored Publish settings without returning secrets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyPortalAccessRequest"
      responses:
        "200":
          description: Portal access verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalAccessVerificationResponse"
        "400":
          description: Invalid verification payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Verification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    PortalSurface:
      name: X-AI-Interface-Surface
      in: header
      required: false
      description: >-
        Optional runtime surface identifier. Use `agent-portal` for frontstage
        Portal-origin runtime calls.
      schema:
        type: string
        enum:
          - agent-portal
    PortalToken:
      name: X-Portal-Token
      in: header
      required: false
      description: >-
        Optional Portal access token for Portal-origin runtime calls.
        `Authorization: Bearer <token>` is also accepted by the server.
      schema:
        type: string
    AuthorizationHeader:
      name: Authorization
      in: header
      required: false
      description: >-
        Optional Bearer token alternative to `X-Portal-Token` for Portal-origin
        runtime calls.
      schema:
        type: string
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PipelineRunId:
      name: pipelineRunId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MissionId:
      name: missionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    MissionReviewMode:
      type: string
      enum:
        - draft_for_review
        - plan_only
    MissionExecutionMode:
      type: string
      enum:
        - plan_only
        - execute_ready
    MissionPlanStatus:
      type: string
      enum:
        - draft
        - needs_confirmation
        - approved
        - executing
        - completed
        - failed
    MissionRiskLevel:
      type: string
      enum:
        - low
        - medium
        - high
    MissionStepStatus:
      type: string
      enum:
        - pending
        - waiting_approval
        - running
        - blocked
        - succeeded
        - failed
        - cancelled
    MissionRevisionStatus:
      type: string
      enum:
        - draft
        - approved
        - superseded
        - executed
    MissionStepApproval:
      type: object
      additionalProperties: false
      properties:
        required:
          type: boolean
        reason:
          type: string
          minLength: 1
        riskLevel:
          $ref: "#/components/schemas/MissionRiskLevel"
      required:
        - required
        - reason
        - riskLevel
    MissionPlanStep:
      type: object
      additionalProperties: false
      properties:
        stepId:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        objective:
          type: string
          minLength: 1
        skillId:
          type: string
        moduleId:
          type: string
          minLength: 1
        assignedAgentId:
          type: string
        roleId:
          type: string
        dependsOn:
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/MissionStepStatus"
        approval:
          $ref: "#/components/schemas/MissionStepApproval"
      required:
        - stepId
        - title
        - objective
        - dependsOn
        - status
    MissionPlan:
      type: object
      additionalProperties: false
      properties:
        missionId:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        userGoal:
          type: string
          minLength: 1
        summary:
          type: string
          minLength: 1
        status:
          $ref: "#/components/schemas/MissionPlanStatus"
        riskLevel:
          $ref: "#/components/schemas/MissionRiskLevel"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/MissionPlanStep"
        warnings:
          type: array
          items:
