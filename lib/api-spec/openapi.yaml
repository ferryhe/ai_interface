openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: modules
    description: Module catalog and ingest operations
  - name: agent-config
    description: Agent control plane configuration
  - name: portal-auth
    description: Portal token verification
  - name: agent-runs
    description: Agent runtime planning and module orchestration
  - name: tool-adapters
    description: External tool adapter metadata and readiness
  - name: skills
    description: Generic skill manifests, UI capabilities, and readiness
  - name: pipelines
    description: Guarded local pipeline run operations and status visibility
  - name: climate-monitor
    description: Climate monitor repository status and guarded run operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /modules:
    get:
      operationId: listModules
      tags: [modules]
      summary: List registered modules
      description: Returns the module catalog available to Agent.
      responses:
        "200":
          description: Registered module catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleListResponse"
  /tool-adapters:
    get:
      operationId: getToolAdapters
      tags: [tool-adapters]
      summary: List tool adapters
      description: Returns external tool adapter metadata and redacted readiness by environment variable name.
      responses:
        "200":
          description: Tool adapter metadata and readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolAdapterListResponse"
  /skills:
    get:
      operationId: getSkills
      tags: [skills]
      summary: List skill manifests
      description: >-
        Returns generic skill manifest metadata, redacted adapter readiness, and
        project path readiness without exposing configured path or secret values.
      responses:
        "200":
          description: Skill manifests and readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillListResponse"
  /climate-monitor/status:
    get:
      operationId: getClimateMonitorStatus
      tags: [climate-monitor]
      summary: Get climate monitor status
      description: >-
        Returns redacted climate monitor repository status, latest report
        summary, source/scope coverage, and git branch/dirty state without
        exposing configured absolute paths or secret values.
      responses:
        "200":
          description: Climate monitor status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClimateMonitorStatusResponse"
        "500":
          description: Failed to read climate monitor status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /climate-monitor/runs:
    post:
      operationId: createClimateMonitorRun
      tags: [climate-monitor]
      summary: Run the climate monitor
      description: >-
        Runs the fixed `python scripts/run_climate_monitor.py --json` command.
        Dry runs are the default, write outputs under the ai_interface workspace
        `.tmp` directory, and add no-sync/no-state-update guards. Live runs are
        rejected unless `CLIMATE_MONITOR_ALLOW_LIVE_RUNS=1` is set on the server.
        The request must include an explicit local command intent header and
        pass same-origin checks. Responses include parsed JSON plus safe command
        metadata.
      parameters:
        - in: header
          name: X-AI-Interface-Command-Intent
          required: true
          schema:
            type: string
            enum: [climate-monitor-run]
          description: Required command intent guard for local climate monitor runs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClimateMonitorRunRequest"
      responses:
        "200":
          description: Climate monitor run result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClimateMonitorRunResponse"
        "400":
          description: Invalid request or climate monitor not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Command guard rejected the request or live runs are disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to run climate monitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /module-runs:
    post:
      operationId: createModuleRun
      tags: [modules]
      summary: Create or update a module run
      description: Idempotently creates or updates a module run by moduleId and externalRunId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateModuleRunRequest"
      responses:
        "200":
          description: Existing module run updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleRunIngestResponse"
        "201":
          description: New module run created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleRunIngestResponse"
        "400":
          description: Invalid ingest payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /module-runs/{runId}:
    get:
      operationId: getModuleRun
      tags: [modules]
      summary: Get a module run
      description: >-
        Returns module run detail. Portal-origin reads send
        `X-AI-Interface-Surface: agent-portal` and require a verified Portal
        token through `X-Portal-Token` or `Authorization: Bearer <token>`.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/PortalSurface"
        - $ref: "#/components/parameters/PortalToken"
        - $ref: "#/components/parameters/AuthorizationHeader"
      responses:
        "200":
          description: Module run detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleRunDetail"
        "403":
          description: Portal access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Module run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateModuleRun
      tags: [modules]
      summary: Update a module run
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateModuleRunRequest"
      responses:
        "200":
          description: Updated module run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleRun"
        "404":
          description: Module run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /module-runs/{runId}/events:
    post:
      operationId: createModuleRunEvent
      tags: [modules]
      summary: Append a module run event
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunEventRequest"
      responses:
        "201":
          description: Event recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunEvent"
        "404":
          description: Module run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /module-runs/{runId}/artifacts:
    post:
      operationId: createModuleRunArtifact
      tags: [modules]
      summary: Store a module artifact
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateArtifactRequest"
      responses:
        "201":
          description: Artifact stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        "404":
          description: Module run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /module-runs/{runId}/interactions:
    post:
      operationId: createModuleRunInteraction
      tags: [modules]
      summary: Request user feedback for a module run
      description: Stores an interaction request from an external tool and marks the run metadata as waiting for user feedback, approval, data, or unblock input.
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateToolInteractionRequest"
      responses:
        "201":
          description: Interaction request recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolInteractionResponse"
        "404":
          description: Module run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /module-runs/{runId}/feedback:
    post:
      operationId: submitModuleRunFeedback
      tags: [modules]
      summary: Submit user feedback for a module run
      description: >-
        Records user or Agent feedback for the active interaction and marks the
        module run as resumable. Portal-origin requests send
        `X-AI-Interface-Surface: agent-portal` and require a verified Portal
        token through `X-Portal-Token` or `Authorization: Bearer <token>`.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/PortalSurface"
        - $ref: "#/components/parameters/PortalToken"
        - $ref: "#/components/parameters/AuthorizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitToolFeedbackRequest"
      responses:
        "200":
          description: Feedback recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolInteractionResponse"
        "403":
          description: Portal access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Module run or active interaction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /module-runs/{runId}/resume:
    post:
      operationId: resumeModuleRunExecution
      tags: [modules]
      summary: Resume execution for a module run
      description: >-
        Consumes a resumable tool interaction, records a resume request, and
        resumes through the safe fake adapter executor. Portal-origin requests
        send `X-AI-Interface-Surface: agent-portal` and require a verified
        Portal token through `X-Portal-Token` or `Authorization: Bearer
        <token>`.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/PortalSurface"
        - $ref: "#/components/parameters/PortalToken"
        - $ref: "#/components/parameters/AuthorizationHeader"
      responses:
        "200":
          description: Resume accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolInteractionResponse"
        "404":
          description: Module run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Portal access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: No resumable interaction or adapter resume unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /artifacts/{artifactId}:
    get:
      operationId: getArtifact
      tags: [modules]
      summary: Get an artifact
      description: >-
        Returns artifact detail. Portal-origin reads send
        `X-AI-Interface-Surface: agent-portal` and require a verified Portal
        token through `X-Portal-Token` or `Authorization: Bearer <token>`.
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
        - $ref: "#/components/parameters/PortalSurface"
        - $ref: "#/components/parameters/PortalToken"
        - $ref: "#/components/parameters/AuthorizationHeader"
      responses:
        "200":
          description: Artifact detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        "403":
          description: Portal access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Artifact not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /agent-runs:
    post:
      operationId: createAgentRun
      tags: [agent-runs]
      summary: Create an Agent runtime plan
      description: >-
        Stores the user message, creates a pipeline run, and plans module runs
        using enabled business skills. Portal-origin requests send
        `X-AI-Interface-Surface: agent-portal` or `metadata.source:
        agent-portal` and require a verified Portal token through
        `X-Portal-Token` or `Authorization: Bearer <token>`.
      parameters:
        - $ref: "#/components/parameters/PortalSurface"
        - $ref: "#/components/parameters/PortalToken"
        - $ref: "#/components/parameters/AuthorizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentRunRequest"
      responses:
        "200":
          description: Agent run planned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunResponse"
        "201":
          description: Agent run planned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunResponse"
        "400":
          description: Invalid Agent run request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Portal access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /agent-runs/{pipelineRunId}:
    get:
      operationId: getAgentRun
      tags: [agent-runs]
      summary: Get an Agent runtime run
      description: >-
        Returns Agent run detail. Portal-origin reads send
        `X-AI-Interface-Surface: agent-portal` and require a verified Portal
        token through `X-Portal-Token` or `Authorization: Bearer <token>`.
      parameters:
        - $ref: "#/components/parameters/PipelineRunId"
        - $ref: "#/components/parameters/PortalSurface"
        - $ref: "#/components/parameters/PortalToken"
        - $ref: "#/components/parameters/AuthorizationHeader"
      responses:
        "200":
          description: Agent run detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunDetail"
        "403":
          description: Portal access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Agent run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /pipelines/runs:
    post:
      operationId: startPipelineRun
      tags: [pipelines]
      summary: Start an actuarial pipeline run
      description: >-
        Starts the built-in ai_actuary actuarial reserving review pipeline over
        registered file-artifact CLI tools. The response exposes Backstage-safe
        step status, inputs, logs, artifacts, and errors without reimplementing
        actuarial calculations in TypeScript. This endpoint triggers local CLI
        execution and therefore requires the command-intent header plus the
        server-side localhost/same-origin request guard.
      parameters:
        - in: header
          name: X-AI-Interface-Command-Intent
          required: true
          schema:
            type: string
            enum: [actuarial-pipeline-run]
          description: Explicit opt-in header required to start a local actuarial pipeline run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartPipelineRunRequest"
      responses:
        "201":
          description: Pipeline run accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActuarialPipelineRun"
        "400":
          description: Invalid pipeline run request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Command intent, localhost, or same-origin guard rejected the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listActuarialPipelineRuns
      tags: [pipelines]
      summary: List actuarial pipeline runs
      description: Requires a localhost/same-origin request because run records can include local artifact paths and artifact payload previews.
      responses:
        "200":
          description: Pipeline run list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActuarialPipelineRunsList"
        "403":
          description: Localhost or same-origin guard rejected the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /pipelines/runs/{runId}:
    get:
      operationId: getPipelineRun
      tags: [pipelines]
      summary: Get an actuarial pipeline run
      description: Requires a localhost/same-origin request because run details can include local artifact paths and artifact payload previews.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Pipeline run detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActuarialPipelineRun"
        "400":
          description: Invalid run id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Localhost or same-origin guard rejected the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pipeline run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /agent-config:
    get:
      operationId: getAgentConfig
      tags: [agent-config]
      summary: Get Agent configuration
      description: Returns the persisted Agent control plane configuration and provider readiness based on required environment variables. Secret values and local provider URLs are never returned.
      responses:
        "200":
          description: Agent configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentConfigResponse"
    put:
      operationId: updateAgentConfig
      tags: [agent-config]
      summary: Update Agent configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgentConfigRequest"
      responses:
        "200":
          description: Updated Agent configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentConfigResponse"
        "400":
          description: Invalid configuration payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /agent-config/test-connection:
    post:
      operationId: testAgentConfigConnection
      tags: [agent-config]
      summary: Test Agent provider connection
      description: Reports provider readiness from server-side environment configuration without accepting or returning secrets or local provider URLs.
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentConnectionTestResponse"
  /portal-auth/verify:
    post:
      operationId: verifyPortalAccess
      tags: [portal-auth]
      summary: Verify Portal access token
      description: Checks a submitted Portal token against stored Publish settings without returning secrets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyPortalAccessRequest"
      responses:
        "200":
          description: Portal access verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalAccessVerificationResponse"
        "400":
          description: Invalid verification payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Verification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    PortalSurface:
      name: X-AI-Interface-Surface
      in: header
      required: false
      description: >-
        Optional runtime surface identifier. Use `agent-portal` for frontstage
        Portal-origin runtime calls.
      schema:
        type: string
        enum:
          - agent-portal
    PortalToken:
      name: X-Portal-Token
      in: header
      required: false
      description: >-
        Optional Portal access token for Portal-origin runtime calls.
        `Authorization: Bearer <token>` is also accepted by the server.
      schema:
        type: string
    AuthorizationHeader:
      name: Authorization
      in: header
      required: false
      description: >-
        Optional Bearer token alternative to `X-Portal-Token` for Portal-origin
        runtime calls.
      schema:
        type: string
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PipelineRunId:
      name: pipelineRunId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    JsonObject:
      type: object
      additionalProperties: true
    ActuarialPipelineRunStatus:
      type: string
      enum:
        - queued
        - running
        - completed
        - failed
    PipelineStepStatus:
      type: string
      enum:
        - pending
        - running
        - completed
        - failed
        - skipped
    StartPipelineRunRequest:
      type: object
      additionalProperties: false
      properties:
        pipelineId:
          type: string
          minLength: 1
        inputPath:
          type: string
          minLength: 1
        artifactRoot:
          type: string
          minLength: 1
        runId:
          type: string
          minLength: 1
      required:
        - inputPath
    PipelineArtifact:
      type: object
      properties:
        artifactKind:
          type: string
        path:
          type: string
        exists:
          type: boolean
        contentJson:
          oneOf:
            - $ref: "#/components/schemas/JsonObject"
            - type: "null"
        contentText:
          type:
            - string
            - "null"
      required:
        - artifactKind
        - path
        - exists
        - contentJson
        - contentText
    PipelineStep:
      type: object
      properties:
        stepId:
          type: string
        toolId:
          type: string
        status:
          $ref: "#/components/schemas/PipelineStepStatus"
        when:
          type: string
        skipReason:
          type:
            - string
            - "null"
        startedAt:
          type:
            - string
            - "null"
        completedAt:
          type:
            - string
            - "null"
        durationMs:
          type:
            - number
            - "null"
        input:
          type: object
          additionalProperties:
            type: string
        output:
          oneOf:
            - $ref: "#/components/schemas/JsonObject"
            - type: "null"
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/PipelineArtifact"
        stdout:
          type:
            - string
            - "null"
        stderr:
          type:
            - string
            - "null"
        stdoutLogPath:
          type:
            - string
            - "null"
        stderrLogPath:
          type:
            - string
            - "null"
        exitCode:
          type:
            - integer
            - "null"
        error:
          oneOf:
            - $ref: "#/components/schemas/JsonObject"
            - type: "null"
      required:
        - stepId
        - toolId
        - status
        - skipReason
        - startedAt
        - completedAt
        - durationMs
        - input
        - output
        - artifacts
        - stdout
        - stderr
        - stdoutLogPath
        - stderrLogPath
        - exitCode
        - error
    ActuarialPipelineRun:
      type: object
      properties:
        runId:
          type: string
        pipelineId:
          type: string
        version:
          type: string
        manifestPath:
          type: string
        inputPath:
          type: string
        artifactRoot:
          type: string
        status:
          $ref: "#/components/schemas/ActuarialPipelineRunStatus"
        governanceStatus:
          type:
            - string
            - "null"
        createdAt:
          type: string
        updatedAt:
          type: string
        startedAt:
          type:
            - string
            - "null"
        completedAt:
          type:
            - string
            - "null"
        durationMs:
          type:
            - number
            - "null"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/PipelineStep"
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/PipelineArtifact"
        error:
          oneOf:
            - $ref: "#/components/schemas/JsonObject"
            - type: "null"
      required:
        - runId
        - pipelineId
        - version
        - manifestPath
        - inputPath
        - artifactRoot
        - status
        - governanceStatus
        - createdAt
        - updatedAt
        - startedAt
        - completedAt
        - durationMs
        - steps
        - artifacts
        - error
